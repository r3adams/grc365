<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Image Gallery</title>
<link href="https://fonts.googleapis.com/css2?family=Satisfy&family=Merriweather&display=swap" rel="stylesheet">
<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  // display: flex;
  align-items: center;
  justify-content: center;
  background: #1a1a1a;
  font-family: Arial, Helvetica, sans-serif;
  color: #eee;
}

h1 {
  font: 36pt/1.4em Satisfy;
  color: white;
  text-align: center;
}

p {
  font: 13pt/1.6em Merriweather;
  width: 60ch;
  margin: 0 auto;
  color: white;
}
	
.gallery {
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  gap: 16px;
  padding: 20px;
  width: 100%;
  max-width: 900px;
  margin: 0 auto;
}

.viewer {
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  width: 100%;
}

.viewer img {
  display: block;
  max-width: 100%;
  max-height: 75vh;
  border-radius: 6px;
  box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
  object-fit: contain;
}

.arrow {
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  width: 48px;
  height: 48px;
  border: none;
  border-radius: 50%;
  background: rgba(0, 0, 0, 0.5);
  color: #fff;
  font-size: 24px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: background 0.2s ease;
}

.arrow:hover,
.arrow:focus-visible {
  background: rgba(0, 0, 0, 0.8);
  outline: none;
}

.arrow-left {
  left: 10px;
}

.arrow-right {
  right: 10px;
}

.counter {
  margin: 0;
  font-size: 14px;
  color: #aaa;
  width: 512px;
  margin: 0 auto;
  text-align: center;
}

@media (max-width: 600px) {
  .arrow {
    width: 40px;
    height: 40px;
    font-size: 20px;
  }
}	
</style>
</head>
<body>
  <h1>Image Gallery by Claude AI</h1>
  <p>Prompt: Write HTML and CSS for a web-based image gallery, for files named "image1.jpg," "image2.jpg," and "image3.jpg," in which the user can advance or go back from one photo to the next by clicking arrows to the right and left of the image.</p>
  <main class="gallery">
    <div class="viewer">
      <button class="arrow arrow-left" id="prev" aria-label="Previous image">&#10094;</button>
      <img id="photo" src="image1.jpg" alt="Gallery image 1">
      <button class="arrow arrow-right" id="next" aria-label="Next image">&#10095;</button>
    </div>
    <p class="counter" id="counter">1 / 3</p>
  </main>

  <script>
    const images = ["image1.jpg", "image2.jpg", "image3.jpg"];
    let current = 0;

    const photo = document.getElementById("photo");
    const counter = document.getElementById("counter");

    function showImage(index) {
      current = index;
      photo.src = images[current];
      photo.alt = `Gallery image ${current + 1}`;
      counter.textContent = `${current + 1} / ${images.length}`;
    }

    document.getElementById("next").addEventListener("click", () => {
      showImage((current + 1) % images.length);
    });

    document.getElementById("prev").addEventListener("click", () => {
      showImage((current - 1 + images.length) % images.length);
    });

    // Optional: keyboard support
    document.addEventListener("keydown", (e) => {
      if (e.key === "ArrowRight") showImage((current + 1) % images.length);
      if (e.key === "ArrowLeft") showImage((current - 1 + images.length) % images.length);
    });
  </script>
</body>
</html>
